[package]
name = "xds"
description = "Scaffolds a project from the cross-platform design system template."
# Written out rather than inherited: npm/build-packages.mjs and the release workflow read it here.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
flate2 = "1.1.11"
# The official Model Context Protocol SDK, for `xds mcp`.
rmcp = { version = "3.10.0", features = ["transport-io", "schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "io-std"] }

[build-dependencies]
flate2 = "1.1.11"
ignore = "0.4.34"
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.2.1"
