name: Release

# Releases the xds CLI. Push a tag that matches the version in cli/Cargo.toml:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The binaries go to a GitHub release, where install.sh finds them. The CLI is not published to
# npm, where xds publishes only under the @xds scope. The web library's packages (@xds/react,
# @xds/solid, @xds/vue, @xds/svelte, @xds/core and @xds/tokens) and the React Native library
# (@xds/react-native) go to npm at the same version once their external consumer checks pass.
# Publishing to npm needs the NPM_TOKEN secret, a token that may publish under @xds. The Compose
# library (io.github.kjmin-dev:xds-ui) goes to Maven Central at the same version once its
# consumer check passes on the desktop and on Android. That needs the MAVEN_CENTRAL_USERNAME and
# MAVEN_CENTRAL_PASSWORD secrets, a Central Portal user token, and SIGNING_KEY and
# SIGNING_PASSWORD, an ASCII-armored PGP secret key whose public key is on a key server. The
# GPUI library's crates (xds-tokens and xds-ui) go to crates.io at the same version once their
# consumer check passes on macOS. That needs the CARGO_REGISTRY_TOKEN secret, a crates.io API
# token scoped to publish-new and publish-update.
#
# A run started by hand (Actions > Release > Run workflow, or `gh workflow run release.yml`) is a
# rehearsal of a release from the commit it runs on, at the version in cli/Cargo.toml: every job
# builds and checks what it would publish, and nothing is released or published. Each publishing
# step is rehearsed instead: npm packs each package and must accept NPM_TOKEN, Maven Central
# validates the signed bundle, which the rehearsal then drops, and cargo packages the crates and
# crates.io must let CARGO_REGISTRY_TOKEN publish them. It fails when a secret a release
# needs is missing or refused, and its summary shows the GitHub release a tag would create.
#
# Actions are pinned to a commit, because a tag can be moved to other code, and these jobs can
# write a release and publish to npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Each job installs the one tool it needs. Without this, `mise exec` would first install
  # every other tool in mise.toml.
  MISE_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl: statically linked, so the binary runs on any distribution. The crate has no C
          # dependencies, so the target's own libc is all the build needs.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag is the crate's version
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but cli/Cargo.toml has version $version."
            exit 1
          fi

      # Only Rust: the build embeds the template's files as they are and runs none of its tools.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: rust
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # `mise exec` selects the toolchain pinned in mise.toml, so the target is added to that
      # one and not to the runner's default.
      - name: Add the Rust target
        run: mise exec -- rustup target add "$TARGET"

      - name: Build
        run: mise exec -- cargo build --package xds --profile dist --target "$TARGET" --locked

      - name: Package
        run: |
          binary=xds
          if [ "$RUNNER_OS" = "Windows" ]; then binary=xds.exe; fi
          archive="xds-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "target/$TARGET/dist" "$binary"
          cd dist
          # install.sh reads the checksum from the first field.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" >"$archive.sha256"
          else
            shasum -a 256 "$archive" >"$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xds-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version every package of the release carries. On a tag, the build job has checked
      # that the tag names it.
      - name: Read the version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)" >> "$GITHUB_ENV"

      # A rehearsal runs before the entries move from `## Unreleased` to the version's section, so
      # it takes those and warns; a release fails without the version's own.
      - name: Read this version's changelog
        run: |
          notes() {
            awk -v heading="## $1" '
              /^## / { selected = ($0 == heading); if (selected) matches++; next }
              selected { print; if (NF) lines++ }
              END { if (matches != 1 || !lines) exit 1 }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          }
          if notes "$VERSION"; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::CHANGELOG.md has no nonempty section '## $VERSION'."
            exit 1
          fi
          echo "::warning::CHANGELOG.md has no nonempty section '## $VERSION', which a release needs: move the entries under '## Unreleased' there before tagging."
          notes Unreleased

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "xds $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

      - name: Rehearse the release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::v$VERSION is already released: raise the version in cli/Cargo.toml for the next release."
          fi
          kind=release
          if [[ "$VERSION" == *-* ]]; then kind=prerelease; fi
          {
            echo "## Rehearsal of xds $VERSION"
            echo
            echo "Nothing was created or published. The tag \`v$VERSION\` on this commit would create a GitHub $kind with these files and notes:"
            echo
            for file in dist/*; do echo "- \`$(basename "$file")\`, $(du -k "$file" | cut -f1) KB"; done
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web library packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # The check scaffolds its reference apps with the binary this release ships.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-x86_64-unknown-linux-musl
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-x86_64-unknown-linux-musl.tar.gz -C binary

      - run: mise exec -- pnpm install --frozen-lockfile

      # Builds the packages into npm/dist/web, installs them in apps outside the repository and
      # compares their design previews with scaffolded apps, pixel by pixel, in Google Chrome.
      - name: Build and check the packages
        run: mise exec -- node npm/web/consumer.ts --xds binary/xds

      # The tokens, what the frameworks share, then the frameworks, under `preview` while the
      # channel is a preview (docs/library.md, "Stability levels").
      - name: Publish
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise exec -- node npm/publish.ts web

      - name: Rehearse publishing
        if: github.event_name != 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise exec -- node npm/publish.ts web --dry-run

  react-native:
    name: React Native library
    needs: release
    # The Android emulator needs KVM, which the Linux runners have and the macOS ones do not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm java
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # The check scaffolds its reference app with the binary this release ships.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-x86_64-unknown-linux-musl
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-x86_64-unknown-linux-musl.tar.gz -C binary

      - run: mise exec -- pnpm install --frozen-lockfile

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and a system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            emulator platform-tools "system-images;android-36;google_apis;x86_64" > /dev/null

      # Builds the package into npm/dist/react-native, installs it in an Expo app and in apps on
      # the oldest and newest supported React Native, type-checks and bundles them, and compares
      # their design previews with a scaffolded app's on an emulator, pixel by pixel.
      - name: Build and check the package
        run: mise exec -- node npm/react-native/consumer.ts --xds binary/xds

      # Under `preview` while React Native is 0.x (docs/library.md, "Stability levels").
      - name: Publish
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise exec -- node npm/publish.ts react-native

      - name: Rehearse publishing
        if: github.event_name != 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise exec -- node npm/publish.ts react-native --dry-run

  maven:
    name: Compose library
    needs: release
    # The iOS artifacts can be built on macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node java
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # The library is built from a project this release's binary scaffolds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-aarch64-apple-darwin
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-aarch64-apple-darwin.tar.gz -C binary

      # Signed here, so the files the checks below consume are the ones Maven Central gets.
      # Without SIGNING_KEY the files are left unsigned, and the upload refuses them.
      - name: Build the library
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: mise exec -- node maven/build.ts --xds binary/xds

      # Consumes the library from a desktop app outside the repository and compares its design
      # preview with a scaffolded project's, pixel by pixel, and links it into iOS frameworks.
      - name: Check the library on the desktop and for iOS
        run: mise exec -- node maven/consumer.ts --skip-build --platforms desktop,ios --xds binary/xds

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-repository
          path: maven/dist/repository/
          if-no-files-found: error

  maven-android:
    name: Compose library on Android
    needs: maven
    # The Android emulator needs KVM, which the Linux runners have and the macOS ones do not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node java
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-x86_64-unknown-linux-musl
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-x86_64-unknown-linux-musl.tar.gz -C binary

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: maven/dist/repository

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and a system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            emulator platform-tools "system-images;android-36;google_apis;x86_64" > /dev/null

      # Consumes the library from an Android app outside the repository and compares its design
      # preview with a scaffolded project's Android app, pixel by pixel, on an emulator.
      - name: Check the library on Android
        run: mise exec -- node maven/consumer.ts --skip-build --platforms android --xds binary/xds

  maven-publish:
    name: Publish the Compose library
    needs: [maven, maven-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: maven/dist/repository

      # Sends the files both checks consumed, signed, and waits until Central accepts them. A
      # rerun after Central has the version does nothing.
      - name: Publish
        if: github.event_name == 'push'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: mise exec -- node maven/upload.ts

      # Central validates the same files as it would before publishing them: the namespace, the
      # signatures against the key servers, the POMs. Then the rehearsal drops the deployment.
      - name: Rehearse publishing
        if: github.event_name != 'push'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: mise exec -- node maven/upload.ts --dry-run

  gpui:
    name: GPUI library
    needs: release
    # GPUI draws the design preview with Metal, so the check runs on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: rust node
          # What is built here is what a release would publish, so no tool comes from a cache
          # another run wrote.
          cache: false

      # The crates are packaged from a project this release's binary scaffolds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-aarch64-apple-darwin
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-aarch64-apple-darwin.tar.gz -C binary

      # Packages xds-tokens and xds-ui into crates-io/dist, consumes them from a crate outside the
      # repository and compares its design preview with a scaffolded project's, pixel by pixel.
      - name: Build and check the crates
        run: mise exec -- node crates-io/consumer.ts --xds binary/xds

      # The files the check consumed, as crates.io takes them (docs/gpui-library.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-crates
          path: crates-io/dist/*.crate
          if-no-files-found: error

      # xds-tokens, then xds-ui, exactly as the check consumed them. A rerun after crates.io has a
      # crate's version skips that crate. crates-io/publish.ts says how it publishes, and what a
      # rehearsal checks instead.
      - name: Publish
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: mise exec -- node crates-io/publish.ts

      - name: Rehearse publishing
        if: github.event_name != 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: mise exec -- node crates-io/publish.ts --dry-run
