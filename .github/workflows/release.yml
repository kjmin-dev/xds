name: Release

# Releases the xds CLI. Push a tag that matches the version in cli/Cargo.toml:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The binaries go to a GitHub release, where install.sh finds them, and to npm as xds-cli, its
# platform packages and create-xds. The web library's packages (@xds/react, @xds/solid,
# @xds/vue, @xds/svelte, @xds/core and @xds/tokens) go to npm at the same version once their
# external consumer check passes. Publishing to npm needs the NPM_TOKEN secret. The Compose
# library (io.github.kjmin-dev:xds-ui) goes to Maven Central at the same version once its
# consumer check passes on the desktop and on Android. That needs the MAVEN_CENTRAL_USERNAME and
# MAVEN_CENTRAL_PASSWORD secrets, a Central Portal user token, and SIGNING_KEY and
# SIGNING_PASSWORD, an ASCII-armored PGP secret key whose public key is on a key server.
#
# Actions are pinned to a commit, because a tag can be moved to other code, and these jobs can
# write a release and publish to npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Each job installs the one tool it needs. Without this, `mise exec` would first install
  # every other tool in mise.toml.
  MISE_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl: statically linked, so the binary runs on any distribution. The crate has no C
          # dependencies, so the target's own libc is all the build needs.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag is the crate's version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but cli/Cargo.toml has version $version."
            exit 1
          fi

      # Only Rust: the build embeds the template's files as they are and runs none of its tools.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: rust
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # `mise exec` selects the toolchain pinned in mise.toml, so the target is added to that
      # one and not to the runner's default.
      - name: Add the Rust target
        run: mise exec -- rustup target add "$TARGET"

      - name: Build
        run: mise exec -- cargo build --package xds --profile dist --target "$TARGET" --locked

      - name: Package
        run: |
          binary=xds
          if [ "$RUNNER_OS" = "Windows" ]; then binary=xds.exe; fi
          archive="xds-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "target/$TARGET/dist" "$binary"
          cd dist
          # install.sh reads the checksum from the first field.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" >"$archive.sha256"
          else
            shasum -a 256 "$archive" >"$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xds-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read this version's changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { selected = ($0 == heading); if (selected) matches++; next }
            selected { print; if (NF) lines++ }
            END { if (matches != 1 || !lines) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "xds ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

  npm:
    name: npm packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true

      # npm/build-packages.mjs wants one directory per Rust target with the binary inside.
      - name: Unpack the binaries
        run: |
          for archive in archives/*.tar.gz; do
            target="$(basename "$archive" .tar.gz)"
            target="${target#xds-}"
            mkdir -p "binaries/$target"
            tar -xzf "$archive" -C "binaries/$target"
          done

      - name: Build the packages
        run: mise exec -- node npm/build-packages.mjs --binaries binaries --require-all

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mise exec -- npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          # In dependency order: the platform packages, then xds-cli, which depends on them,
          # then create-xds, which depends on xds-cli.
          tag=latest
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then tag=next; fi
          for package in npm/dist/xds-cli-*/ npm/dist/xds-cli/ npm/dist/create-xds/; do
            name="$(basename "$package")"
            version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' "$package/package.json")"
            # A rerun after a partial failure skips what the first run published.
            if mise exec -- npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              mise exec -- npm publish "$package" --access public --tag "$tag"
            fi
          done

  web:
    name: Web library packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # The check scaffolds its reference apps with the binary this release ships.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-x86_64-unknown-linux-musl
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-x86_64-unknown-linux-musl.tar.gz -C binary

      - run: mise exec -- pnpm install --frozen-lockfile

      # Builds the packages into npm/dist/web, installs them in apps outside the repository and
      # compares their design previews with scaffolded apps, pixel by pixel, in Google Chrome.
      - name: Build and check the packages
        run: mise exec -- node npm/web/consumer.ts --xds binary/xds

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mise exec -- npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          # The web channel is a preview while its behavior library, Zag.js 2, is a prerelease
          # (docs/library.md, "Stability levels"), so its releases take the `preview` dist-tag.
          tag=preview
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then tag=next; fi
          # In dependency order: the tokens, what the frameworks share, then the frameworks.
          for package in tokens core react solid vue svelte; do
            dir="npm/dist/web/$package"
            name="$(mise exec -- node -p "require('./$dir/package.json').name")"
            version="$(mise exec -- node -p "require('./$dir/package.json').version")"
            # A rerun after a partial failure skips what the first run published.
            if mise exec -- npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              mise exec -- npm publish "$dir" --access public --tag "$tag"
            fi
          done

  maven:
    name: Compose library
    needs: release
    # The iOS artifacts can be built on macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node java
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # The library is built from a project this release's binary scaffolds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-aarch64-apple-darwin
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-aarch64-apple-darwin.tar.gz -C binary

      # Signed here, so the files the checks below consume are the ones Maven Central gets.
      - name: Build the library
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: mise exec -- node maven/build.ts --xds binary/xds

      # Consumes the library from a desktop app outside the repository and compares its design
      # preview with a scaffolded project's, pixel by pixel.
      - name: Check the library on the desktop
        run: mise exec -- node maven/consumer.ts --skip-build --platforms desktop --xds binary/xds

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-repository
          path: maven/dist/repository/
          if-no-files-found: error

  maven-android:
    name: Compose library on Android
    needs: maven
    # The Android emulator needs KVM, which the Linux runners have and the macOS ones do not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node java
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xds-x86_64-unknown-linux-musl
          path: archives

      - name: Unpack the binary
        run: mkdir -p binary && tar -xzf archives/xds-x86_64-unknown-linux-musl.tar.gz -C binary

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: maven/dist/repository

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and a system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            emulator platform-tools "system-images;android-36;google_apis;x86_64" > /dev/null

      # Consumes the library from an Android app outside the repository and compares its design
      # preview with a scaffolded project's Android app, pixel by pixel, on an emulator.
      - name: Check the library on Android
        run: mise exec -- node maven/consumer.ts --skip-build --platforms android --xds binary/xds

  maven-publish:
    name: Publish the Compose library
    needs: [maven, maven-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: maven/dist/repository

      # Sends the files both checks consumed, signed, and waits until Central accepts them. A
      # rerun after Central has the version does nothing.
      - name: Publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: mise exec -- node maven/upload.ts
