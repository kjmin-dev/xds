# The workflows that hold a credential pin their actions to a commit, and a pin never moves by
# itself. Once a month, Dependabot proposes the newer commits in one pull request, and only
# releases that have been public for two weeks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
