[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
acme-tokens = { path = "crates/acme-tokens" }
acme-ui = { path = "crates/acme-ui" }

# GPUI, GPUI Component and their assets. GPUI has no stable release, so pin exactly.
gpui-kit = "=0.9.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# GPUI is unusably slow without optimizations, even in dev builds.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-pre-macos]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
