name: Docs

# Deploys the documentation site in apps/docs to Cloudflare Workers, as static assets.
#
# It does nothing until it is set up (see the "Hosting this site" page):
#   - environment "cloudflare" with the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
#     limited to the main branch
#   - variable DOCS_DEPLOY=true to deploy on every push to main; without it, only a manual run
#     deploys
#   - variable DOCS_SITE with the site's public address, such as https://xds.example.com
#   - variable PREVIEW_SITE with the address of the web design preview that the Preview workflow
#     deploys, such as https://preview.xds.example.com; without it, no page links to the preview
#
# The repository is public and the token can replace any Worker in the account, so:
#   - Nothing here runs for a pull request, and a fork's pull request never sees a secret.
#   - Building and deploying are separate jobs. The build runs the code of every dependency and
#     has no secret. The deploy job has the token and runs only Wrangler, at the version and
#     checksums in pnpm-lock.yaml, on the files the build uploaded.
#   - Actions are pinned to a commit, because a tag can be moved to other code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - docs/**
      - design/**
      - packages/ui/**
      - packages/tokens/**
      # The component pages link to the design preview's sections by name.
      - apps/web/src/DesignPreview.tsx
      - install.sh
      - .github/workflows/docs.yml

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      # Only Node and pnpm are installed here, as in the deploy job.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm
      - run: mise run check:docs
        env:
          DOCS_SITE: ${{ vars.DOCS_SITE }}
          PREVIEW_SITE: ${{ vars.PREVIEW_SITE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The secrets are the environment's, not the repository's: only a run on main gets them.
    environment: cloudflare
    env:
      # Only Node and pnpm are installed here. Without this, `mise exec` and `mise run` would
      # first install every other tool in mise.toml.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm
          # A cache is written by whichever job saved it first, and the build job runs code
          # this job must not trust. The two tools download in seconds.
          cache: false
      - name: Install Wrangler from the lockfile
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --filter @acme/deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: apps/docs/dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The cloudflare environment needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See the Hosting this site page."
            exit 1
          fi
          mise run deploy:docs
