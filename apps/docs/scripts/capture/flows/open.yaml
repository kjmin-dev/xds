# Opens a screen of the app by its link, from a cold start, and waits until it has drawn TEXT.
appId: ${APP_ID}
---
- stopApp
- openLink: ${LINK}
# iOS may first ask whether to open the app; whichever comes first is waited for.
- extendedWaitUntil:
    visible: "${TEXT}|Open"
    timeout: 60000
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: ${TEXT}
    timeout: 60000
# The preview's skeletons pulse for as long as they are on screen, so this stops after a while.
- waitForAnimationToEnd:
    timeout: 5000
