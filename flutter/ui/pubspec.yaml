name: acme_ui
description: Acme touch components built on the Flutter widgets layer.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: acme.ui
        pluginClass: AcmeGlassPlugin
      ios:
        pluginClass: AcmeGlassPlugin
