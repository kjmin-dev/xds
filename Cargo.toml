[workspace]
resolver = "3"
members = [
  "crates/*",
  "apps/desktop",
  # @if template
  "cli",
  # @endif
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
acme-tokens = { path = "crates/acme-tokens" }
acme-ui = { path = "crates/acme-ui" }

# GPUI, GPUI Component and their assets. GPUI has no stable release, so pin exactly.
gpui-kit = "=0.9.1"

# Dates for the date picker, and the names, formats and first weekday of the system's locale.
# pure-rust-locales is the table chrono's `unstable-locales` reads; it is named here as well for
# the first weekday, which chrono does not expose, so keep it at the version chrono takes.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "unstable-locales"] }
pure-rust-locales = "0.8.2"
sys-locale = "0.3.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# GPUI is unusably slow without optimizations, even in dev builds.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-pre-macos]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# @if template
# The xds binary that gets released: small and quick to start, at the cost of a slow build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# @endif
