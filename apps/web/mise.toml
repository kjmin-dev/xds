[tasks.dev]
description = "Run the web app on http://localhost:5173"
depends = ["//:install"]
run = "pnpm exec vite"

[tasks.build]
description = "Build the web app into dist/"
depends = ["//:install"]
run = "pnpm exec vite build"
sources = ["src/**/*", "public/**/*", "index.html", "vite.config.ts", "../../packages/*/src/**/*"]
outputs = ["dist/**/*"]

[tasks.preview]
description = "Serve the built web app"
depends = ["build"]
run = "pnpm exec vite preview"
