name: Release

# Releases the xds CLI. Push a tag that matches the version in cli/Cargo.toml:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The binaries go to a GitHub release, where install.sh finds them, and to npm as xds-cli, its
# platform packages and create-xds. Publishing to npm needs the NPM_TOKEN secret.
#
# Actions are pinned to a commit, because a tag can be moved to other code, and these jobs can
# write a release and publish to npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Each job installs the one tool it needs. Without this, `mise exec` would first install
  # every other tool in mise.toml.
  MISE_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl: statically linked, so the binary runs on any distribution. The crate has no C
          # dependencies, so the target's own libc is all the build needs.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag is the crate's version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but cli/Cargo.toml has version $version."
            exit 1
          fi

      # Only Rust: the build embeds the template's files as they are and runs none of its tools.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: rust
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      # `mise exec` selects the toolchain pinned in mise.toml, so the target is added to that
      # one and not to the runner's default.
      - name: Add the Rust target
        run: mise exec -- rustup target add "$TARGET"

      - name: Build
        run: mise exec -- cargo build --package xds --profile dist --target "$TARGET" --locked

      - name: Package
        run: |
          binary=xds
          if [ "$RUNNER_OS" = "Windows" ]; then binary=xds.exe; fi
          archive="xds-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "target/$TARGET/dist" "$binary"
          cd dist
          # install.sh reads the checksum from the first field.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" >"$archive.sha256"
          else
            shasum -a 256 "$archive" >"$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xds-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "xds ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

  npm:
    name: npm packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node
          # What is built here is published, so no tool comes from a cache another run wrote.
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true

      # npm/build-packages.mjs wants one directory per Rust target with the binary inside.
      - name: Unpack the binaries
        run: |
          for archive in archives/*.tar.gz; do
            target="$(basename "$archive" .tar.gz)"
            target="${target#xds-}"
            mkdir -p "binaries/$target"
            tar -xzf "$archive" -C "binaries/$target"
          done

      - name: Build the packages
        run: mise exec -- node npm/build-packages.mjs --binaries binaries --require-all

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mise exec -- npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          # In dependency order: the platform packages, then xds-cli, which depends on them,
          # then create-xds, which depends on xds-cli.
          for package in npm/dist/xds-cli-*/ npm/dist/xds-cli/ npm/dist/create-xds/; do
            name="$(basename "$package")"
            version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' "$package/package.json")"
            # A rerun after a partial failure skips what the first run published.
            if mise exec -- npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              mise exec -- npm publish "$package" --access public
            fi
          done
