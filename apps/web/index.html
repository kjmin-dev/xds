<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme</title>
    <script>
      // Set the theme before first paint. The design tokens read data-theme.
      // `?theme=dark` or `?theme=light` overrides the system setting, for looking at one mode.
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme") ??
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
