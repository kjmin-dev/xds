# Tools and tasks for the whole repository. Install mise (https://mise.jdx.dev), then:
#
#   mise install         install the pinned toolchains
#   mise run check       run everything CI runs
#   mise tasks --all     list every task, including each app's
#
# @if js-workspace rust-workspace
# Each app under apps/ has its own mise.toml. Its tasks are addressed by path
# (`mise run //apps/<app>:dev`) or by the alias below (`mise run //<app>:dev`).
# @endif
# @if kotlin-compose
# The Kotlin build under kotlin/ has its own mise.toml: `mise run //kotlin:desktop`.
# @endif
# @if template
#
# The lines between an `@if <names>` comment and its `@endif` belong to the client stacks
# named, and to every stack that requires a shared unit named (`js-workspace`, from
# template.json): `xds create` keeps them in a project only when one of those stacks is
# selected, and never copies the comments themselves. `@if template` marks what only this
# repository needs. See docs/cli.md.
# @endif

min_version = "2026.10.0"
monorepo_root = true

[monorepo]
config_roots = [
  # @if js-workspace rust-workspace
  "apps/*",
  # @endif
  # @if kotlin-compose
  "kotlin",
  # @endif
  # @if dart-flutter
  "flutter",
  # @endif
]
lockfile = true

# @if js-workspace rust-workspace
[monorepo.path_aliases]
# @if desktop-gpui
desktop = "apps/desktop"
# @endif
# @if desktop-electron
desktop-electron = "apps/desktop-electron"
# @endif
# @if desktop-tauri
desktop-tauri = "apps/desktop-tauri"
# @endif
# @if mobile-react-native
mobile = "apps/mobile"
# @endif
# @if web-react
web = "apps/web"
# @endif
# @if web-solid
web-solid = "apps/web-solid"
# @endif
# @if web-vue
web-vue = "apps/web-vue"
# @endif
# @if web-svelte
web-svelte = "apps/web-svelte"
# @endif
# @if template
docs = "apps/docs"
# @endif

# @endif
[tools]
# The token generator runs on Node alone, so every project needs it.
node = "26.13.1"
# @if js-workspace
pnpm = "12.19.0"
# @endif
# @if rust-workspace
rust = { version = "1.99.1", components = "rustfmt,clippy" }
# @endif
# @if dart-flutter
flutter = "3.50.0"
# @endif
# @if kotlin-compose dart-flutter
java = "temurin-17"
# @endif
actionlint = "1.7.12"

# @if js-workspace
# ---------------------------------------------------------------- setup

[tasks.install]
description = "Install JavaScript dependencies"
run = "pnpm install"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/*/package.json",
  "packages/*/package.json",
  "tools/*/package.json",
]
outputs = { auto = true }

# @endif
# ---------------------------------------------------------------- generated code
#
# The generator has no dependencies: it needs Node and nothing installed, so these tasks work
# the same in a project without a JavaScript workspace.

[tasks.tokens]
description = "Generate the platform token files from design/tokens"
run = "node tools/design-build/src/build.ts"

[tasks."check:generated"]
description = "Fail if committed generated code is out of date"
run = "node tools/design-build/src/build.ts --check"

[tasks.theme]
description = "List the color themes, or apply one and regenerate: mise run theme ocean"
run = "node tools/design-build/src/theme.ts"

# ---------------------------------------------------------------- checks

# @if js-workspace rust-workspace dart-flutter
[tasks.fmt]
description = "Format everything"
# @if js-workspace
depends = ["install"]
# @endif
run = [
  # @if rust-workspace
  "cargo fmt --all",
  # @endif
  # @if js-workspace
  # Lint fixes first: the formatter then lays out whatever they changed.
  "pnpm exec oxlint --fix",
  "pnpm exec oxfmt",
  # @endif
  # @if dart-flutter
  "dart format flutter/ui/lib flutter/ui/test flutter/ui/test_render flutter/app/lib flutter/app/test",
  # @endif
]

# @endif
# @if js-workspace
[tasks."check:js"]
description = "Lint, type-check, and test the TypeScript workspace"
depends = ["install"]
run = [
  "pnpm exec oxfmt --check",
  # Before the steps that run tsrs: it fails when tsrs ports a different TypeScript version from
  # the typescript package that editors are pointed at.
  "node tools/check-tsrs.ts",
  # Type information adds rules such as no-floating-promises, and makes the run slower, so it is
  # only here. So is the check for unused disable directives: to a run without the type-aware
  # rules, a directive for one of them looks unused, and `oxlint --fix` in fmt would delete it.
  "pnpm exec oxlint --type-aware --report-unused-disable-directives-severity=error",
  "pnpm --recursive --if-present run typecheck",
  "pnpm --recursive --if-present run test",
  # @if ui-core
  # A production build of a web app catches what the type checker cannot: unresolved imports,
  # and CSS that Tailwind rejects. The build scripts leave type-checking to the step above.
  # @endif
  # @if web-react
  "pnpm --filter @acme/web build",
  # @endif
  # @if web-solid
  "pnpm --filter @acme/web-solid build",
  # @endif
  # @if web-vue
  "pnpm --filter @acme/web-vue build",
  # @endif
  # @if web-svelte
  "pnpm --filter @acme/web-svelte build",
  # @endif
  # @if template
  # The web library's npm packages: it fails when the build leaves the placeholder name in them.
  "node npm/web/build.ts",
  # @endif
  # @if mobile-react-native
  # Neither is visible to the type checker: a native package that has moved off the version the
  # Expo SDK expects, and an import that Metro cannot resolve for iOS or Android.
  { task = "//mobile:check" },
  { task = "//mobile:bundle" },
  # @endif
]

[tasks."check:js".env]
# The type-aware rules run on tsrs-lint, so that they and the type check run on one engine, tsrs.
# Without this, oxlint takes the first backend it finds in node_modules/.bin or on PATH. pnpm
# writes a .CMD shim beside the shell script on Windows, and only that one can be started there.
OXLINT_TSGOLINT_PATH = "node_modules/.bin/tsrs-lint{% if os_family() == 'windows' %}.CMD{% endif %}"
# tsrs-lint turns on tsrs's fast preset unless told not to. The preset sizes the pool of checkers
# to the machine's cores and lets them steal work, which can change what a rule reports from one
# machine to the next. With it off, the rules run on TypeScript's own checker settings, as the
# type check does, and report the same everywhere.
TSRS_FAST = "0"

# @endif
# @if ui-core
# It compares the design previews of every web app in the project with each other, and has
# nothing to compare in a project with one.
[tasks."compare:previews"]
description = "Compare the design previews of the web apps pixel by pixel, in headless Google Chrome"
depends = ["install"]
run = "node packages/ui-core/scripts/compare-previews.ts"

# @endif
# @if desktop-gpui
[tasks."check:rust"]
description = "Format-check the Rust workspace, then lint and test the crates that build on any OS"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --exclude 'acme-desktop*' --exclude acme-ui --all-targets -- --deny warnings",
  "cargo test --workspace --exclude 'acme-desktop*' --exclude acme-ui",
]

[tasks."check:desktop"]
description = "Lint, test, and build the desktop app and its UI crate (macOS)"
run = [
  "cargo clippy --package acme-desktop --package acme-ui --all-targets -- --deny warnings",
  "cargo test --package acme-desktop --package acme-ui",
  "cargo build --package acme-desktop",
]

# @endif
# @if template
[tasks."check:cli"]
description = "Lint and test the xds CLI on its own (check:rust covers it too; CI runs this on macOS and Windows)"
run = [
  "cargo clippy --package xds --all-targets -- --deny warnings",
  "cargo test --package xds",
]

[tasks."check:docs"]
description = "Build the documentation site, which fails on a page whose source is missing"
depends = ["install"]
run = "pnpm --filter @acme/docs build"

# What the release workflow runs before it publishes the web packages: it builds them, installs
# them with npm in apps outside the repository, and compares those apps' design previews with
# scaffolded ones, pixel by pixel. It needs the network and Google Chrome, and is not part of
# `check`. docs/web-library.md says what it compares.
[tasks."check:library-web"]
description = "Install the web library's packages in new apps and compare their design previews with scaffolded apps"
depends = ["install"]
run = "node npm/web/consumer.ts"

# The same for the Compose library: it builds it into a Maven repository directory, consumes it
# from a desktop app and an Android app outside the repository, and compares their design
# previews with a scaffolded project's, pixel by pixel. It needs a JDK, the Android SDK with an
# emulator system image installed in $ANDROID_HOME, and the network; `-- --platforms desktop`
# leaves Android out. docs/compose-library.md says what it compares.
[tasks."check:library-compose"]
description = "Consume the Compose library from new desktop and Android apps and compare their design previews with a scaffolded project"
run = "node maven/consumer.ts"

# The pictures of the iOS, Android and Compose apps on the component pages. It needs ffmpeg and
# cwebp; iOS needs macOS with Xcode and CocoaPods, and Android an emulator system image already
# installed in $ANDROID_HOME. apps/docs/scripts/capture.ts says what it does.
[tasks."docs:capture"]
description = "Take the docs' pictures of the iOS, Android and Compose apps: mise run docs:capture -- all"
depends = ["install"]
run = "node apps/docs/scripts/capture.ts"
# Here rather than under [tools], so that only this task downloads it.
tools = { "github:mobile-dev-inc/maestro" = { version = "2.12.1", version_prefix = "cli-" } }

# The deploy tasks upload a dist directory that is already built, and deliberately depend on
# nothing: the workflows build in one job and deploy in another, so that the job holding the
# Cloudflare token runs Wrangler from the lockfile and no other code. Locally, build first, and
# Wrangler uses your `wrangler login`.

[tasks."deploy:docs"]
description = "Deploy apps/docs/dist to Cloudflare Workers; build it first with mise run check:docs"
run = "pnpm --filter @acme/deploy exec wrangler deploy --cwd ../../apps/docs"

[tasks."deploy:preview"]
description = "Deploy apps/web/dist to Cloudflare Workers; build it first with mise run //web:build"
run = "pnpm --filter @acme/deploy exec wrangler deploy --cwd ../../apps/web"

[tasks."build:cli"]
description = "Build the xds binary the way a release does, into target/dist/xds"
run = "cargo build --package xds --profile dist"

[tasks.xds]
description = "Run the xds CLI from source: mise run xds -- list"
run = "cargo run --quiet --package xds --"

# @endif
[tasks."check:workflows"]
description = "Lint the GitHub Actions workflows"
# The files are named because actionlint otherwise looks for them through git, and fails in a
# directory that is not a repository yet.
run = "actionlint .github/workflows/*.yml"

[tasks.check]
description = "Run everything CI runs"
# The generated files first: when they are stale, the failures of the other checks only
# repeat that in less obvious ways.
run = [
  { task = "check:generated" },
  { tasks = [
    # @if js-workspace
    "check:js",
    # @endif
    # @if desktop-gpui
    "check:rust",
    "check:desktop",
    # @endif
    # @if desktop-electron
    "//desktop-electron:check",
    # @endif
    # @if desktop-tauri
    "//desktop-tauri:check",
    # @endif
    # @if kotlin-compose
    "//kotlin:check",
    # @endif
    # @if dart-flutter
    "//flutter:check",
    # @endif
    # @if template
    "check:docs",
    # @endif
    "check:workflows",
  ] },
]
