[tasks.dev]
description = "Run the Vue web app on http://localhost:5175"
depends = ["//:install"]
run = "pnpm exec vite"

[tasks.build]
description = "Build the Vue web app into dist/"
depends = ["//:install"]
run = "pnpm exec vite build"
sources = ["src/**/*", "index.html", "vite.config.ts", "../../packages/*/src/**/*"]
outputs = ["dist/**/*"]

[tasks.preview]
description = "Serve the built Vue web app"
depends = ["build"]
run = "pnpm exec vite preview"
