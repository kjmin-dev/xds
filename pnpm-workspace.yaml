packages:
  # @if template
  - apps/docs
  # @endif
  # @if web-react
  - apps/web
  # @endif
  # @if mobile-react-native
  - apps/mobile
  # @endif
  # @if web-solid
  - apps/web-solid
  # @endif
  # @if web-vue
  - apps/web-vue
  # @endif
  # @if web-svelte
  - apps/web-svelte
  # @endif
  # @if desktop-electron
  - apps/desktop-electron
  # @endif
  # @if desktop-tauri
  - apps/desktop-tauri
  # @endif
  - packages/*
  - tools/*

# One version of each of these across the workspace.
catalog:
  # @if web-react mobile-react-native
  # Expo pins React exactly, and two copies of React in one bundle break hooks.
  "@types/react": ~19.3.0
  react: 19.3.0
  # @if mobile-react-native
  # The mobile app declares react-dom too, as Expo's own template does: expo-router's web tabs
  # need it, and pnpm would otherwise install a react-dom newer than this react for them.
  # @endif
  react-dom: 19.3.0
  # @endif
  # These two move together. tsrs, which type-checks and runs the type-aware lint rules on the
  # command line, is a Rust port built from one TypeScript commit, and typescript is the version
  # editors are pointed at, so both are exact pins: a range would let one of them move without the
  # other. On a TypeScript upgrade, take the tsrs release that ports the new version (`pnpm view
  # tsrs@<release> tsrs.typescriptVersion` shows the version a release ports); check:js fails
  # while the two differ.
  # @if mobile-react-native
  # The mobile app lists typescript in `expo.install.exclude`: the Expo SDK expects an older
  # TypeScript, and `expo install --fix` would otherwise move the app off this pin.
  # @endif
  tsrs: 0.25.0-ts7.1.0-beta
  typescript: 7.1.0-beta
  # @if ui-core
  # The state machines behind the overlays and the composite controls of the web libraries.
  # Every @zag-js package must be the same exact version: each framework adapter pins
  # @zag-js/core exactly, and 2.0 is still a prerelease that changes the attributes the
  # stylesheet of @acme/ui-core selects on.
  "@zag-js/accordion": 2.0.0-next.4
  "@zag-js/aria-hidden": 2.0.0-next.4
  "@zag-js/date-picker": 2.0.0-next.4
  "@zag-js/dialog": 2.0.0-next.4
  "@zag-js/menu": 2.0.0-next.4
  "@zag-js/remove-scroll": 2.0.0-next.4
  "@zag-js/select": 2.0.0-next.4
  "@zag-js/slider": 2.0.0-next.4
  "@zag-js/tabs": 2.0.0-next.4
  "@zag-js/tooltip": 2.0.0-next.4
  # The dates of the date picker's machine, which takes it as a peer. Exact, so that every web
  # library and @acme/ui-core hand the machine the same date classes.
  "@internationalized/date": 3.12.4
  # @endif
  # @if web-react
  "@zag-js/react": 2.0.0-next.4
  # @endif
  # @if web-solid
  "@zag-js/solid": 2.0.0-next.4
  # Exact pins while Solid 2 is a release candidate: @solidjs/web's `latest` tag is still rc.0,
  # and @solidjs/vite-plugin's `next` tag is older than its `latest`.
  solid-js: 2.0.0-rc.21
  "@solidjs/web": 2.0.0-rc.21
  "@solidjs/vite-plugin": 3.0.0-next.57
  # @endif
  # @if web-vue
  "@zag-js/vue": 2.0.0-next.4
  vue: 3.5.45
  # @endif
  # @if web-svelte
  "@zag-js/svelte": 2.0.0-next.4
  svelte: 5.57.3
  "@sveltejs/vite-plugin-svelte": 7.3.1
  # svelte-check's type checking on TypeScript 7 (--tsgo-experimental-api) is experimental, so
  # it is an exact pin, upgraded together with typescript. It finds TypeScript 7 only under the
  # name @typescript/native, which is the same exact version as typescript above (check:js
  # fails otherwise); its own TypeScript, which reads the Svelte files, is set in .pnpmfile.cjs.
  svelte-check: 4.7.8
  "@typescript/native": npm:typescript@7.1.0-beta
  # @endif
# @if web-vue

# Named catalogs, for what only some packages take.
catalogs:
  # The Vue packages take these in place of the default catalog's typescript. vue-tsc, which
  # type-checks .vue files, runs on TypeScript's JavaScript API, which TypeScript 7 no longer has,
  # and so does Vite's SFC compiler where a component's props use a type imported from another
  # package. The bridge keeps TypeScript 6.0.3's API with the TypeScript 7 checker (tsgo 7.0.2)
  # behind it. Every Vue package declares this typescript itself: otherwise pnpm can hand vue the
  # root's TypeScript 7, and the build then fails on such props. Exact pins: the bridge's version
  # is a prerelease string, which a range would not match.
  vue:
    typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
    vue-tsc: 3.3.14
    "@vitejs/plugin-vue": 6.0.11
# @endif
# @if ui-core

# Zag 2.0.0-next.4 was less than a day old when it was added. Drop these once it is older than
# pnpm's minimum release age.
minimumReleaseAgeExclude:
  - "@zag-js/accordion@2.0.0-next.4"
  - "@zag-js/anatomy@2.0.0-next.4"
  - "@zag-js/aria-hidden@2.0.0-next.4"
  - "@zag-js/collection@2.0.0-next.4"
  - "@zag-js/core@2.0.0-next.4"
  - "@zag-js/dialog@2.0.0-next.4"
  - "@zag-js/dismissable@2.0.0-next.4"
  - "@zag-js/dom-query@2.0.0-next.4"
  - "@zag-js/focus-trap@2.0.0-next.4"
  - "@zag-js/focus-visible@2.0.0-next.4"
  - "@zag-js/interact-outside@2.0.0-next.4"
  - "@zag-js/live-region@2.0.0-next.4"
  - "@zag-js/menu@2.0.0-next.4"
  - "@zag-js/popper@2.0.0-next.4"
  # @if web-react
  - "@zag-js/react@2.0.0-next.4"
  # @endif
  - "@zag-js/rect-utils@2.0.0-next.4"
  - "@zag-js/remove-scroll@2.0.0-next.4"
  - "@zag-js/safe-area@2.0.0-next.4"
  - "@zag-js/select@2.0.0-next.4"
  - "@zag-js/slider@2.0.0-next.4"
  # @if web-solid
  - "@zag-js/solid@2.0.0-next.4"
  # @endif
  # @if web-svelte
  - "@zag-js/svelte@2.0.0-next.4"
  # @endif
  - "@zag-js/tabs@2.0.0-next.4"
  - "@zag-js/tooltip@2.0.0-next.4"
  - "@zag-js/types@2.0.0-next.4"
  - "@zag-js/utils@2.0.0-next.4"
  # @if web-vue
  - "@zag-js/vue@2.0.0-next.4"
  # @endif
# @endif
# @if template

# Wrangler (tools/deploy) deploys the two sites as static assets, which needs neither package's
# install script. Deployments run with a credential, so nothing runs that does not have to.
allowBuilds:
  esbuild: false
  workerd: false
# @endif

# @if desktop-electron
# Electron Forge checks that pnpm has a hoist pattern before it packages the app.
hoistPattern: ["*"]
# @endif
