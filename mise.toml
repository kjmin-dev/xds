# Tools and tasks for the whole repository. Install mise (https://mise.jdx.dev), then:
#
#   mise install         install the pinned toolchains
#   mise run check       run everything CI runs
#   mise tasks --all     list every task, including each app's
#
# @if js-workspace rust-workspace
# Each app under apps/ has its own mise.toml. Its tasks are addressed by path
# (`mise run //apps/<app>:dev`) or by the alias below (`mise run //<app>:dev`).
# @endif
# @if kotlin-compose
# The Kotlin build under kotlin/ has its own mise.toml: `mise run //kotlin:desktop`.
# @endif
# @if template
#
# The lines between an `@if <names>` comment and its `@endif` belong to the client stacks
# named, and to every stack that requires a shared unit named (`js-workspace`, from
# template.json): `xds create` keeps them in a project only when one of those stacks is
# selected, and never copies the comments themselves. `@if template` marks what only this
# repository needs. See docs/cli.md.
# @endif

min_version = "2026.10.0"
monorepo_root = true

[monorepo]
config_roots = [
  # @if js-workspace rust-workspace
  "apps/*",
  # @endif
  # @if kotlin-compose
  "kotlin",
  # @endif
]
lockfile = true

# @if js-workspace rust-workspace
[monorepo.path_aliases]
# @if desktop-gpui
desktop = "apps/desktop"
# @endif
# @if mobile-react-native
mobile = "apps/mobile"
# @endif
# @if web-react
web = "apps/web"
# @endif
# @if template
docs = "apps/docs"
# @endif

# @endif
[tools]
# The token generator runs on Node alone, so every project needs it.
node = "26.13.1"
# @if js-workspace
pnpm = "12.19.0"
# @endif
# @if desktop-gpui
rust = { version = "1.99.1", components = "rustfmt,clippy" }
# @endif
# @if kotlin-compose
java = "temurin-17"
# @endif
actionlint = "1.7.12"

# @if js-workspace
# ---------------------------------------------------------------- setup

[tasks.install]
description = "Install JavaScript dependencies"
run = "pnpm install"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/*/package.json",
  "packages/*/package.json",
  "tools/*/package.json",
]
outputs = { auto = true }

# @endif
# ---------------------------------------------------------------- generated code
#
# The generator has no dependencies: it needs Node and nothing installed, so these tasks work
# the same in a project without a JavaScript workspace.

[tasks.tokens]
description = "Generate the platform token files from design/tokens"
run = "node tools/design-build/src/build.ts"

[tasks."check:generated"]
description = "Fail if committed generated code is out of date"
run = "node tools/design-build/src/build.ts --check"

[tasks.theme]
description = "List the color themes, or apply one and regenerate: mise run theme ocean"
run = "node tools/design-build/src/theme.ts"

# ---------------------------------------------------------------- checks

# @if js-workspace rust-workspace
[tasks.fmt]
description = "Format everything"
# @if js-workspace
depends = ["install"]
# @endif
run = [
  # @if desktop-gpui
  "cargo fmt --all",
  # @endif
  # @if js-workspace
  # Lint fixes first: the formatter then lays out whatever they changed.
  "pnpm exec oxlint --fix",
  "pnpm exec oxfmt",
  # @endif
]

# @endif
# @if js-workspace
[tasks."check:js"]
description = "Lint, type-check, and test the TypeScript workspace"
depends = ["install"]
run = [
  "pnpm exec oxfmt --check",
  # Type information adds rules such as no-floating-promises, and makes the run slower, so it is
  # only here. So is the check for unused disable directives: to a run without the type-aware
  # rules, a directive for one of them looks unused, and `oxlint --fix` in fmt would delete it.
  "pnpm exec oxlint --type-aware --report-unused-disable-directives-severity=error",
  "pnpm --recursive --if-present run typecheck",
  "pnpm --recursive --if-present run test",
  # @if web-react
  # A production build of the web app catches what the type checker cannot: unresolved
  # imports, and CSS that Tailwind rejects.
  "pnpm --filter @acme/web build",
  # @endif
]

# @endif
# @if desktop-gpui
[tasks."check:rust"]
description = "Format-check the Rust workspace, then lint and test the crates that build on any OS"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --exclude acme-desktop --exclude acme-ui --all-targets -- --deny warnings",
  "cargo test --workspace --exclude acme-desktop --exclude acme-ui",
]

[tasks."check:desktop"]
description = "Lint, test, and build the desktop app and its UI crate (macOS)"
run = [
  "cargo clippy --package acme-desktop --package acme-ui --all-targets -- --deny warnings",
  "cargo test --package acme-desktop --package acme-ui",
  "cargo build --package acme-desktop",
]

# @endif
# @if template
[tasks."check:cli"]
description = "Lint and test the xds CLI on its own (check:rust covers it too; CI runs this on macOS and Windows)"
run = [
  "cargo clippy --package xds --all-targets -- --deny warnings",
  "cargo test --package xds",
]

[tasks."check:docs"]
description = "Build the documentation site, which fails on a page whose source is missing"
depends = ["install"]
run = "pnpm --filter @acme/docs build"

# The deploy tasks upload a dist directory that is already built, and deliberately depend on
# nothing: the workflows build in one job and deploy in another, so that the job holding the
# Cloudflare token runs Wrangler from the lockfile and no other code. Locally, build first, and
# Wrangler uses your `wrangler login`.

[tasks."deploy:docs"]
description = "Deploy apps/docs/dist to Cloudflare Workers; build it first with mise run check:docs"
run = "pnpm --filter @acme/deploy exec wrangler deploy --cwd ../../apps/docs"

[tasks."deploy:preview"]
description = "Deploy apps/web/dist to Cloudflare Workers; build it first with mise run //web:build"
run = "pnpm --filter @acme/deploy exec wrangler deploy --cwd ../../apps/web"

[tasks."build:cli"]
description = "Build the xds binary the way a release does, into target/dist/xds"
run = "cargo build --package xds --profile dist"

[tasks.xds]
description = "Run the xds CLI from source: mise run xds -- list"
run = "cargo run --quiet --package xds --"

# @endif
[tasks."check:workflows"]
description = "Lint the GitHub Actions workflows"
# The files are named because actionlint otherwise looks for them through git, and fails in a
# directory that is not a repository yet.
run = "actionlint .github/workflows/*.yml"

[tasks.check]
description = "Run everything CI runs"
# The generated files first: when they are stale, the failures of the other checks only
# repeat that in less obvious ways.
run = [
  { task = "check:generated" },
  { tasks = [
    # @if js-workspace
    "check:js",
    # @endif
    # @if desktop-gpui
    "check:rust",
    "check:desktop",
    # @endif
    # @if kotlin-compose
    "//kotlin:check",
    # @endif
    # @if template
    "check:docs",
    # @endif
    "check:workflows",
  ] },
]
